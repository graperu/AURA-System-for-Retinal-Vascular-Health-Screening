spring:
  application:
    name: aura-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aura_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:aura_password123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

aura:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    simulate-if-offline: true
  anonymization:
    hmac-secret: AURA_HIPAA_NFR_JAVA_HMAC_SECRET_2026
