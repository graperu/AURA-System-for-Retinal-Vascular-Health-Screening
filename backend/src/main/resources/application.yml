server:
  port: 8080

spring:
  application:
    name: aura-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aura}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom Application Properties for AI Core Integration
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000/analyze}
