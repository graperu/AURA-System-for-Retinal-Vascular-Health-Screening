server:
  port: 8080
spring:
  application:
    name: aura-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
aura:
  ai:
    service-url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-api-key: ${AI_INTERNAL_API_KEY:}
  jwt:
    secret: ${JWT_SECRET}
