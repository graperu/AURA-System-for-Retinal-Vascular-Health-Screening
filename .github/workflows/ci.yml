name: AURA CI/CD Pipeline

on:
  push:
    branches: [ "main", "Dinh", "develop" ]
  pull_request:
    branches: [ "main", "Dinh", "develop" ]

jobs:
  backend-ci:
    name: Backend Test & Build (Cloud AI Engine)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test Backend (Spring Boot)
        working-directory: ./backend
        run: |
          mvn clean test -Dtest="!*IntegrationTest,!DoctorPatientAssignmentSecurityTest,!UserRepositoryTest"

      - name: Package Backend JAR
        working-directory: ./backend
        run: |
          mvn package -DskipTests

  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeCheck & Build Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

  docker-compose-validate:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build All Docker Images
        run: |
          docker compose build
