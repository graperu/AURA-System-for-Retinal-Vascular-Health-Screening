name: aura

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aura}
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aura-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aura-network]

  ai-core:
    build:
      context: ./ai-core
    environment:
      AI_CORE_SERVICE_NAME: AURA AI Core
      AI_CORE_MODEL_VERSION: mock-retinal-v1
    ports:
      - "${AI_CORE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aura-network]

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aura}
      DATABASE_USERNAME: ${POSTGRES_USER:-aura}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-aura_dev_password}
      AI_CORE_BASE_URL: http://ai-core:8000
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aura-network]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [aura-network]

networks:
  aura-network:
    driver: bridge

volumes:
  aura-postgres-data:
