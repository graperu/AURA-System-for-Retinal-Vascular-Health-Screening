name: aura

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    command: postgres -c shared_buffers=128MB -c work_mem=8MB -c maintenance_work_mem=32MB -c max_connections=60 -c temp_buffers=8MB
    environment:
      POSTGRES_DB: aura_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aura_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/aura_db
      DB_USERNAME: postgres
      DB_PASSWORD: aura_password123
      SERVER_PORT: 8081
      GEMINI_AI_ENABLED: "true"
      GEMINI_API_URL: "https://dallas-adequate-isolation-unity.trycloudflare.com/v1/chat/completions"
      GEMINI_API_KEY: "sk-7b0cdba71ad7d98c-r1c29o-13878c62"
      GEMINI_MODEL: "ag/gemini-3.7-flash-high"
      JAVA_OPTS: "-XX:+UseG1GC -Xms256m -Xmx768m -XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          memory: 384M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data:
